<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="70%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#d4af37" />
      <stop offset="60%" stop-color="#aa771c" />
      <stop offset="85%" stop-color="#e5c07b" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Golden Border -->
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6" />
  <rect x="28" y="28" width="456" height="456" rx="84" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="6,6" opacity="0.4" />

  <!-- Islamic 8-Pointed Star Motif -->
  <g transform="translate(256,230)" filter="url(#glow)">
    <!-- Rotating star geometric layers -->
    <rect x="-85" y="-85" width="170" height="170" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.5" />
    <rect x="-85" y="-85" width="170" height="170" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" transform="rotate(45)" opacity="0.5" />
    
    <!-- Inner Crescent & Star -->
    <circle cx="0" cy="0" r="60" fill="#0c0a09" stroke="url(#goldGrad)" stroke-width="2" />
    <path d="M 12,-35 A 40 40 0 1 0 12,35 A 32 32 0 1 1 12,-35 Z" fill="url(#goldGrad)" />
    <!-- 8-point mini star inside crescent -->
    <circle cx="16" cy="-4" r="5" fill="#fef08a" />
  </g>

  <!-- Title "أَثَر" in Luxury Arabic Calligraphic styling -->
  <text x="256" y="375" text-anchor="middle" font-family="'Cairo', 'Amiri', serif" font-weight="800" font-size="52" fill="url(#goldGrad)" letter-spacing="4">أَثَـــــر</text>
  
  <!-- Subtitle ATHAR -->
  <text x="256" y="415" text-anchor="middle" font-family="'Cinzel', serif" font-weight="700" font-size="19" fill="#e5c07b" letter-spacing="9" opacity="0.9">A T H A R</text>
  
  <!-- Subtle baseline flourish -->
  <path d="M 180,432 Q 256,442 332,432" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" />
  <circle cx="256" cy="437" r="3" fill="url(#goldGrad)" />
</svg>
